<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>CyberBeat Pixel</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- ==================== 开始画面 - 曲库选择 ==================== -->
    <div id="startScreen" class="screen">
        <div class="bg-grid"></div>
        
        <div class="start-layout">
            <!-- 左侧：LOGO + 状态 -->
            <div class="start-sidebar">
                <div class="logo-block">
                    <h1 class="logo">CYBER<br>BEAT</h1>
                    <p class="subtitle">PIXEL DREAM</p>
                </div>
                
                <div class="current-selection" id="currentSelection">
                    <div class="cs-label">SELECTED</div>
                    <div class="cs-name" id="selectedSongName">NONE</div>
                    <div class="cs-source" id="selectedSongSource"></div>
                </div>
                
                <div class="start-actions">
                    <button class="pixel-btn dark" id="settingsBtn" disabled>
                        <span class="btn-icon">⚙</span> CONFIG
                    </button>
                    <button class="pixel-btn green" id="startBtn" disabled>
                        <span class="btn-icon">▶</span> START
                    </button>
                </div>
            </div>
            
            <!-- 右侧：曲库列表 -->
            <div class="start-main">
                <div class="song-panel">
                    <div class="song-panel-header">
                        <span class="panel-title">MUSIC SELECT</span>
                        <span class="panel-count" id="songCount">0 TRACKS</span>
                    </div>
                    
                    <div class="song-list-wrapper" id="songListWrapper">
                        <!-- 导入 MIDI -->
                        <div class="song-card import-card" id="importMidiCard">
                            <div class="card-accent"></div>
                            <div class="card-body">
                                <div class="card-icon import-card-icon">📂</div>
                                <div class="card-info">
                                    <span class="card-title import-title">IMPORT MIDI</span>
                                    <span class="card-sub import-sub">Load from device</span>
                                </div>
                                <div class="card-arrow">▶</div>
                            </div>
                            <input type="file" id="midiUpload" accept=".mid" class="card-file-input">
                        </div>
                        
                        <!-- 分割线 -->
                        <div class="song-divider">
                            <span class="divider-text">LIBRARY</span>
                        </div>
                        
                        <!-- 曲库歌曲 -->
                        <div class="song-cards" id="songCards">
                            <!-- JS 动态渲染 -->
                        </div>
                        
                        <!-- 空状态 -->
                        <div class="song-empty" id="songEmpty" style="display:none;">
                            <span class="empty-icon">🎵</span>
                            <span class="empty-text">NO SONGS IN LIBRARY</span>
                            <span class="empty-hint">Use IMPORT MIDI above</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 设置画面 ==================== -->
    <div id="settingsScreen" class="screen hidden">
        <div class="settings-overlay">
            <div class="settings-card">
                <div class="settings-header">
                    <h2 class="settings-title">CONFIGURATION</h2>
                </div>
                
                <div class="settings-song-info" id="settingsSongInfo">
                    <span class="ssi-title" id="settingsSongTitle">NO SONG</span>
                    <span class="ssi-artist" id="settingsSongArtist"></span>
                </div>

                <div class="settings-group">
                    <span class="settings-label">DIFFICULTY</span>
                    <div class="diff-selector-row">
                        <button class="diff-btn easy" data-diff="easy">EASY</button>
                        <button class="diff-btn easy-plus" data-diff="easy+">EASY+</button>
                        <button class="diff-btn normal" data-diff="normal">NORMAL</button>
                        <button class="diff-btn normal-plus active" data-diff="normal+">NORMAL+</button>
                    </div>
                </div>

                <div class="settings-group">
                    <span class="settings-label">NOTE STYLE</span>
                    <div class="style-selector-row">
                        <button class="style-btn" data-style="pixel">
                            <span class="style-preview style-pixel"></span>
                            <span>PIXEL</span>
                        </button>
                        <button class="style-btn active" data-style="orb">
                            <span class="style-preview style-orb"></span>
                            <span>ORB</span>
                        </button>
                    </div>
                </div>

                <div class="settings-group">
                    <span class="settings-label">SPEED</span>
                    <div class="speed-row">
                        <button class="speed-btn" id="speedDown">−</button>
                        <span class="speed-value" id="speedValue">16.0</span>
                        <button class="speed-btn" id="speedUp">+</button>
                    </div>
                </div>

                <div class="settings-actions">
                    <button class="pixel-btn dark" id="settingsBackBtn">BACK</button>
                    <button class="pixel-btn green" id="settingsStartBtn">START GAME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 结果画面 ==================== -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-overlay">
            <div class="result-card">
                <div class="rank" id="rankDisplay">S</div>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" id="finalScore">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">MAX COMBO</span>
                        <span class="stat-value" id="finalCombo">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">ACC</span>
                        <span class="stat-value" id="finalAccuracy">0%</span>
                    </div>
                    <div class="stat-box p">
                        <span class="stat-label">PERFECT</span>
                        <span class="stat-value" id="finalPerfect">0</span>
                    </div>
                    <div class="stat-box g">
                        <span class="stat-label">GREAT</span>
                        <span class="stat-value" id="finalGreat">0</span>
                    </div>
                    <div class="stat-box m">
                        <span class="stat-label">MISS</span>
                        <span class="stat-value" id="finalMiss">0</span>
                    </div>
                </div>
                
                <div class="chart-box">
                    <span class="chart-title">PERFORMANCE</span>
                    <canvas id="lineChartCanvas"></canvas>
                </div>
                
                <div class="result-actions">
                    <button class="pixel-btn purple" id="exportBtn">EXPORT RESULT</button>
                    <button class="pixel-btn green" id="homeBtn">HOME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 移动端控制 ==================== -->
    <div id="mobileControls">
        <div class="mobile-btns">
            <div class="mobile-btn" data-key="d">D</div>
            <div class="mobile-btn" data-key="f">F</div>
            <div class="mobile-btn" data-key="j">J</div>
            <div class="mobile-btn" data-key="k">K</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/audio-engine.js"></script>
    <script src="js/midi-parser.js"></script>
    <script src="js/note-generator.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
