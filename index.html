<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberBeat Pixel</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <div class="bg-grid"></div>
        <div class="pixel-box">
            <div class="logo-container">
                <h1 class="logo">CYBER<br>BEAT</h1>
                <p class="subtitle">PIXEL DREAM</p>
            </div>
            
            <div class="status-display">
                <div class="status-item">
                    <span class="label">MODE</span>
                    <span class="value" id="displayMode">CUSTOM</span>
                </div>
                <div class="status-item">
                    <span class="label">STYLE</span>
                    <span class="value" id="displayDiff">NORMAL+</span>
                </div>
            </div>

            <div class="action-area">
                <div id="midiSection" class="file-slot">
                    <div class="icon">▼</div>
                    <span class="text">INSERT MIDI</span>
                    <input type="file" id="midiUpload" accept=".mid">
                </div>
                <div class="file-name-display" id="fileName">NO FILE</div>

                <div class="btn-row">
                    <button class="pixel-btn dark" id="settingsBtn">CONFIG</button>
                    <button class="pixel-btn green" id="startBtn">START</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Screen -->
    <div id="settingsScreen" class="screen hidden">
        <div class="pixel-box">
            <h2 style="color: var(--pixel-blue); margin-bottom: 20px; font-size: 16px; width:100%; text-align:center;">
                CONFIGURATION
            </h2>

            <div class="settings-group">
                <span class="settings-label">MODE</span>
                <div class="btn-row">
                    <button class="pixel-btn" id="modePreset">PRESET</button>
                    <button class="pixel-btn pink" id="modeCustom">CUSTOM</button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">DIFFICULTY</span>
                <div class="diff-selector-row">
                    <button class="diff-btn easy" data-diff="easy">EASY</button>
                    <button class="diff-btn easy-plus" data-diff="easy+">EASY+</button>
                    <button class="diff-btn normal" data-diff="normal">NORMAL</button>
                    <button class="diff-btn normal-plus active" data-diff="normal+">NORMAL+</button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">NOTE STYLE</span>
                <div class="style-selector-row">
                    <button class="style-btn" data-style="pixel">
                        <span class="preview"><span class="preview-pixel"></span></span>
                        <span>PIXEL</span>
                    </button>
                    <button class="style-btn active" data-style="orb">
                        <span class="preview"><span class="preview-orb"></span></span>
                        <span>ORB</span>
                    </button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">SPEED</span>
                <div class="btn-row" style="justify-content: center;">
                    <button class="pixel-btn pink" id="speedDown" style="max-width: 50px; flex: 0 0 50px;">-</button>
                    <span class="speed-value" style="min-width: 60px; text-align: center; align-self: center; color: var(--pixel-yellow);" id="speedValue">16.0</span>
                    <button class="pixel-btn pink" id="speedUp" style="max-width: 50px; flex: 0 0 50px;">+</button>
                </div>
            </div>

            <button class="pixel-btn green" id="backBtn" style="margin-top: 10px;">BACK</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen hidden">
        <div class="result-content">
            <div class="pixel-box">
                <div class="rank" id="rankDisplay">S</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">SCORE</div>
                        <div class="stat-value" id="finalScore">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">MAX COMBO</div>
                        <div class="stat-value" id="finalCombo">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">ACC</div>
                        <div class="stat-value" id="finalAccuracy">0%</div>
                    </div>
                    <div class="stat-box p">
                        <div class="stat-label">PERFECT</div>
                        <div class="stat-value" id="finalPerfect">0</div>
                    </div>
                    <div class="stat-box g">
                        <div class="stat-label">GREAT</div>
                        <div class="stat-value" id="finalGreat">0</div>
                    </div>
                    <div class="stat-box m">
                        <div class="stat-label">MISS</div>
                        <div class="stat-value" id="finalMiss">0</div>
                    </div>
                </div>
                <div class="chart-box">
                    <span class="chart-title">PERFORMANCE</span>
                    <canvas id="lineChartCanvas"></canvas>
                </div>
                <div class="result-actions">
                    <button class="pixel-btn purple" id="exportBtn">EXPORT RESULT</button>
                    <button class="pixel-btn green" id="homeBtn">HOME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls">
        <div class="mobile-btns">
            <div class="mobile-btn" data-key="d">D<span></span></div>
            <div class="mobile-btn" data-key="f">F<span></span></div>
            <div class="mobile-btn" data-key="j">J<span></span></div>
            <div class="mobile-btn" data-key="k">K<span></span></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/game-state.js"></script>
    <script src="js/audio-engine.js"></script>
    <script src="js/midi-parser.js"></script>
    <script src="js/note-generator.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
